name: Docker Publish



on:
  workflow_run:
    workflows: [frontend-CI]
    types: [completed]
    branches: [main]

#  workflow_dispatch:

jobs:
  deploy:
    needs: docker-publish
    uses: ./.github/workflows/cd.yml
    with:
      image_tag: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit


  docker-publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' 
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]

    steps:
      - name: checkout tested code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: prepare frontend build configuaration
        if: matrix.service == 'frontend'
        env:
          API_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Set the VITE_API_BASE_URL repository variable."
            exit 1
          fi
          printf 'VITE_API_BASE_URL=%s\n' "$API_URL" > frontend/.env

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v4

      - name: login to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image to docker-hub
        uses: docker/build-push-action@v7
        with:
          context: ./${{matrix.service}}
          file: ./${{matrix.service}}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}






